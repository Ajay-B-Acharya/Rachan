name: harmoniq
description: "Harmoniq — Your music. Your rhythm. An offline music player."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.9.43
  just_audio_background: ^0.0.1-beta.17
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/brand_mark.png
